<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Search</title>
  <style>
    :root {
      --bg: #0c0e12;
      --surface: #151922;
      --surface2: #1c2230;
      --border: #2a3344;
      --text: #f0f3f8;
      --muted: #8d9bb3;
      --accent: #7c6cf0;
      --accent-hover: #9588f5;
      --spin: #34d399;
      --oci: #60a5fa;
      --ok: #34d399;
      --bad: #f87171;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .movie-search-dashboard-marker { display: none; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-wrap: wrap;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin: 0.15rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .runtime-pick {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .runtime-pick select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.65rem;
      font-size: 0.9rem;
    }
    .tabs {
      display: flex;
      gap: 0.25rem;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab {
      background: none;
      border: none;
      color: var(--muted);
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .search-hero {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .search-hero input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.85rem 1rem;
      font-size: 1.05rem;
    }
    .search-hero input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.85rem 1.25rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn.secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.secondary:hover { border-color: var(--muted); }
    .status-line {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .status-line .error { color: var(--bad); }
    .status-line strong { color: var(--text); }
    .results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .movie-grid {
      display: grid;
      gap: 1rem;
    }
    .movie-card {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 1rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.15s;
    }
    .movie-card:hover { border-color: #3d4d66; }
    .poster {
      width: 56px;
      height: 84px;
      border-radius: 8px;
      background: linear-gradient(145deg, #2a3344, #1a2030);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--muted);
    }
    .movie-card h3 {
      margin: 0 0 0.25rem;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .movie-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .movie-overview {
      margin: 0;
      font-size: 0.9rem;
      color: #b8c4d8;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty, .loading {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .pager {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .parity {
      display: inline-flex;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .parity.match { color: var(--ok); }
    .parity.mismatch { color: var(--bad); }
    .parity.pending { color: var(--muted); }
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 900px) { .compare-grid { grid-template-columns: 1fr; } }
    .runtime-col {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }
    .runtime-col.spin { border-top: 3px solid var(--spin); }
    .runtime-col.oci { border-top: 3px solid var(--oci); }
    .runtime-col-head {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.95rem;
    }
    .runtime-col-body { padding: 0.75rem 1rem; max-height: 420px; overflow-y: auto; }
    .runtime-col-body .movie-card {
      grid-template-columns: 40px 1fr;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .runtime-col-body .poster { width: 40px; height: 56px; font-size: 1rem; }
    .tech-footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body data-app="movie-search-dashboard">
  <span class="movie-search-dashboard-marker">movie-search</span>

  <header class="topbar">
    <div class="brand">
      <h1>Movie Search</h1>
      <p>44,471 movies · shared Rust core</p>
    </div>
    <div class="runtime-pick" id="runtime-pick-app">
      <label for="runtime-select">Backend</label>
      <select id="runtime-select" aria-label="Select backend">
        <option value="spin">Spin / WASM (:8080)</option>
        <option value="oci">OCI / Docker (:8081)</option>
      </select>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-panel="search" role="tab">Search</button>
    <button type="button" class="tab" data-panel="browse" role="tab">Browse</button>
    <button type="button" class="tab" data-panel="compare" role="tab">Compare runtimes</button>
  </nav>

  <main>
    <section id="panel-search" class="panel active" role="tabpanel">
      <form class="search-hero" id="search-form">
        <input
          id="query"
          type="search"
          placeholder="Search by title, genre, or plot…"
          autocomplete="off"
          value=""
        >
        <button type="submit" class="btn">Search</button>
      </form>
      <div class="status-line" id="app-status">Connecting…</div>
      <div class="results-meta" id="search-meta" hidden></div>
      <div id="search-results" class="movie-grid">
        <p class="empty">Enter a query to search the catalog.</p>
      </div>
      <div class="pager" id="search-pager" hidden>
        <button type="button" class="btn secondary" id="search-prev" disabled>Previous</button>
        <button type="button" class="btn secondary" id="search-next" disabled>Next page</button>
      </div>
    </section>

    <section id="panel-browse" class="panel" role="tabpanel">
      <div class="status-line" id="browse-status"></div>
      <div class="results-meta" id="browse-meta"></div>
      <div id="browse-results" class="movie-grid">
        <p class="loading">Loading catalog…</p>
      </div>
      <div class="pager">
        <button type="button" class="btn secondary" id="browse-prev" disabled>Previous</button>
        <button type="button" class="btn secondary" id="browse-next" disabled>Next page</button>
      </div>
    </section>

    <section id="panel-compare" class="panel" role="tabpanel">
      <form class="search-hero" id="compare-form">
        <input
          id="compare-query"
          type="search"
          placeholder="Query to run on both runtimes…"
          value="space"
        >
        <button type="submit" class="btn">Search both</button>
      </form>
      <div id="parity" class="parity pending">Search to compare Spin and OCI</div>
      <div class="compare-grid">
        <div class="runtime-col spin">
          <div class="runtime-col-head">Spin / WASM · <span id="spin-link-text">:8080</span></div>
          <div class="runtime-col-body" id="spin-results"></div>
        </div>
        <div class="runtime-col oci">
          <div class="runtime-col-head">OCI / Docker · <span id="oci-link-text">:8081</span></div>
          <div class="runtime-col-body" id="oci-results"></div>
        </div>
      </div>
    </section>

    <footer class="tech-footer">
      API: POST /search, GET /movies — server default page size (20). No client limit override.
    </footer>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const URLS = {
      spin: params.get("spin") || "http://127.0.0.1:8080",
      oci: params.get("oci") || "http://127.0.0.1:8081",
    };

    document.getElementById("spin-link-text").textContent = URLS.spin.replace(/^https?:\/\//, "");
    document.getElementById("oci-link-text").textContent = URLS.oci.replace(/^https?:\/\//, "");

    let activeBackend = "spin";
    let searchState = { q: "", offset: 0, total: 0, pageSize: 20 };
    let browseState = { offset: 0, total: 0, pageSize: 20 };

    function activeUrl() {
      return URLS[activeBackend];
    }

    async function fetchJson(base, path, options) {
      const started = performance.now();
      const res = await fetch(`${base}${path}`, options);
      const elapsed = Math.round(performance.now() - started);
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`${res.status} ${text}`);
      }
      const data = await res.json();
      return { data, elapsed };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function movieCard(movie, compact) {
      const year = movie.year ? ` · ${movie.year}` : "";
      const overview = movie.overview
        ? `<p class="movie-overview">${escapeHtml(movie.overview)}</p>`
        : "";
      if (compact) {
        return `
          <article class="movie-card">
            <div class="poster">🎬</div>
            <div>
              <h3>${escapeHtml(movie.title)}</h3>
              <div class="movie-meta">${escapeHtml(movie.genre)}${year}</div>
            </div>
          </article>`;
      }
      return `
        <article class="movie-card">
          <div class="poster">🎬</div>
          <div>
            <h3>${escapeHtml(movie.title)}</h3>
            <div class="movie-meta">${escapeHtml(movie.genre)}${year} · #${movie.id}</div>
            ${overview}
          </div>
        </article>`;
    }

    function renderMovieList(container, movies, emptyMessage) {
      if (!movies.length) {
        container.innerHTML = `<p class="empty">${emptyMessage}</p>`;
        return;
      }
      container.innerHTML = movies.map(m => movieCard(m, false)).join("");
    }

    async function loadAppStatus() {
      const el = document.getElementById("app-status");
      try {
        const { data: health } = await fetchJson(activeUrl(), "/health");
        const { data: version } = await fetchJson(activeUrl(), "/version");
        const { data: stats } = await fetchJson(activeUrl(), "/stats");
        el.innerHTML = `
          <strong>${health.status}</strong> ·
          ${version.engine} ·
          ${stats.documentCount.toLocaleString()} movies ·
          backend <strong>${activeBackend === "spin" ? "Spin/WASM" : "OCI/Docker"}</strong>
        `;
      } catch (err) {
        el.innerHTML = `<span class="error">Backend unavailable: ${escapeHtml(err.message)}</span>`;
      }
    }

    async function runSearch(offset = 0) {
      const q = document.getElementById("query").value.trim();
      const container = document.getElementById("search-results");
      const meta = document.getElementById("search-meta");
      const pager = document.getElementById("search-pager");

      container.innerHTML = `<p class="loading">Searching…</p>`;
      meta.hidden = true;
      pager.hidden = true;

      const body = { q };
      if (offset > 0) body.offset = offset;

      try {
        const { data, elapsed } = await fetchJson(activeUrl(), "/search", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });

        searchState = {
          q,
          offset: data.offset,
          total: data.estimatedTotalHits,
          pageSize: data.limit,
        };

        renderMovieList(
          container,
          data.hits,
          q ? "No movies matched your search." : "No movies in catalog."
        );

        const from = data.estimatedTotalHits ? data.offset + 1 : 0;
        const to = Math.min(data.offset + data.hits.length, data.estimatedTotalHits);
        meta.innerHTML = `
          <span>${data.estimatedTotalHits.toLocaleString()} result(s)${q ? ` for “${escapeHtml(q)}”` : ""}</span>
          <span>Showing ${from}–${to} · ${elapsed} ms · page size ${data.limit} (server default)</span>
        `;
        meta.hidden = false;
        pager.hidden = false;

        document.getElementById("search-prev").disabled = data.offset <= 0;
        document.getElementById("search-next").disabled =
          data.offset + data.hits.length >= data.estimatedTotalHits;
      } catch (err) {
        container.innerHTML = `<p class="empty error">${escapeHtml(err.message)}</p>`;
      }
    }

    async function runBrowse(offset = 0) {
      const container = document.getElementById("browse-results");
      const meta = document.getElementById("browse-meta");
      const status = document.getElementById("browse-status");

      container.innerHTML = `<p class="loading">Loading…</p>`;

      try {
        const { data, elapsed } = await fetchJson(
          activeUrl(),
          `/movies?offset=${offset}`
        );

        browseState = {
          offset: data.offset,
          total: data.total,
          pageSize: data.limit,
        };

        renderMovieList(container, data.results, "No movies found.");

        const from = data.total ? data.offset + 1 : 0;
        const to = Math.min(data.offset + data.results.length, data.total);
        meta.textContent = `Catalog ${from}–${to} of ${data.total.toLocaleString()} · ${elapsed} ms`;
        status.innerHTML = `Browsing via <strong>${activeBackend === "spin" ? "Spin/WASM" : "OCI/Docker"}</strong>`;

        document.getElementById("browse-prev").disabled = data.offset <= 0;
        document.getElementById("browse-next").disabled =
          data.offset + data.results.length >= data.total;
      } catch (err) {
        container.innerHTML = `<p class="empty">${escapeHtml(err.message)}</p>`;
        meta.textContent = "";
      }
    }

    function hitIds(payload) {
      if (!payload || payload.error) return null;
      return (payload.data.hits || []).map(h => h.id);
    }

    function updateParity(spinPayload, ociPayload) {
      const el = document.getElementById("parity");
      const spinIds = hitIds(spinPayload);
      const ociIds = hitIds(ociPayload);
      if (spinIds === null || ociIds === null) {
        el.className = "parity mismatch";
        el.textContent = "Could not compare — one or both backends failed";
        return;
      }
      const match =
        spinIds.length === ociIds.length && spinIds.every((id, i) => id === ociIds[i]);
      el.className = match ? "parity match" : "parity mismatch";
      el.textContent = match
        ? `Match — same ranking (${spinIds.length} hits)`
        : `Mismatch — compare hit order manually`;
    }

    async function compareSearch(q) {
      const body = JSON.stringify({ q });
      const [spinPayload, ociPayload] = await Promise.all([
        fetchJson(URLS.spin, "/search", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body,
        }).catch(err => ({ error: err.message })),
        fetchJson(URLS.oci, "/search", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body,
        }).catch(err => ({ error: err.message })),
      ]);

      function renderCompare(el, payload) {
        if (payload.error) {
          el.innerHTML = `<p class="empty">${escapeHtml(payload.error)}</p>`;
          return;
        }
        const hits = payload.data.hits || [];
        const meta = `${hits.length} of ${payload.data.estimatedTotalHits} · ${payload.elapsed} ms`;
        el.innerHTML =
          `<p class="movie-meta" style="margin:0 0 0.5rem">${meta}</p>` +
          hits.map(m => movieCard(m, true)).join("") ||
          `<p class="empty">No hits</p>`;
      }

      renderCompare(document.getElementById("spin-results"), spinPayload);
      renderCompare(document.getElementById("oci-results"), ociPayload);
      updateParity(spinPayload, ociPayload);
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(`panel-${tab.dataset.panel}`).classList.add("active");
        document.getElementById("runtime-pick-app").style.display =
          tab.dataset.panel === "compare" ? "none" : "flex";
        if (tab.dataset.panel === "browse") runBrowse(browseState.offset);
      });
    });

    document.getElementById("runtime-select").addEventListener("change", (e) => {
      activeBackend = e.target.value;
      loadAppStatus();
      const panel = document.querySelector(".panel.active")?.id;
      if (panel === "panel-search" && searchState.q !== undefined) runSearch(searchState.offset);
      if (panel === "panel-browse") runBrowse(browseState.offset);
    });

    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      runSearch(0);
    });

    document.getElementById("search-prev").addEventListener("click", () => {
      runSearch(Math.max(0, searchState.offset - searchState.pageSize));
    });
    document.getElementById("search-next").addEventListener("click", () => {
      runSearch(searchState.offset + searchState.pageSize);
    });

    document.getElementById("browse-prev").addEventListener("click", () => {
      runBrowse(Math.max(0, browseState.offset - browseState.pageSize));
    });
    document.getElementById("browse-next").addEventListener("click", () => {
      runBrowse(browseState.offset + browseState.pageSize);
    });

    document.getElementById("compare-form").addEventListener("submit", (e) => {
      e.preventDefault();
      compareSearch(document.getElementById("compare-query").value.trim());
    });

    loadAppStatus();
    runBrowse(0);
  </script>
</body>
</html>
