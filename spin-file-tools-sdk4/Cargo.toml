[package]
name = "spin-file-tools"
version = "0.1.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
spin-sdk = "4.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
