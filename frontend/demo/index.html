<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime comparison — Movie Search</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/demo.css" />
  </head>
  <body data-app="movie-search-demo">
    <header class="site-header demo-header">
      <div class="brand">
        <h1>Runtime comparison demo</h1>
        <p>Same query against Spin/WASM and OCI/Docker — benchmark presentation only.</p>
      </div>
      <a class="back-link" href="../">← Back to app</a>
    </header>

    <main class="container">
      <form id="compare-form" class="search-form">
        <input id="compare-query" type="search" value="space" />
        <button type="submit" class="btn primary">Search both</button>
      </form>
      <div id="parity" class="parity pending">Search to compare runtimes</div>
      <div class="compare-grid">
        <section class="compare-col spin">
          <h2>Spin / WASM · <span id="spin-label">:8080</span></h2>
          <div id="spin-results" class="compare-results"></div>
        </section>
        <section class="compare-col oci">
          <h2>OCI / Docker · <span id="oci-label">:8081</span></h2>
          <div id="oci-results" class="compare-results"></div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/demo/main.js"></script>
  </body>
</html>
